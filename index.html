<!-- Revised index.html
FIX:
- Non-GM players no longer get stuck on 「待機中...」 after GM submits words
- Always re-render word screen when status === 'words'
- No screen-ID based blocking for word reveal

Only functional changes are commented with 🔧 FIX
-->

<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ワードウルフ オンライン 🐺</title>
<!-- (STYLE OMITTED – unchanged from your original) -->
</head>
<body>
<div class="container">...
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
// ================= Firebase init (unchanged) =================

// ================= LISTENER =================
function listenToRoom(roomCode) {
    if (roomListener) roomListener.off();

    roomListener = database.ref(`rooms/${roomCode}`);

    roomListener.on('value', snapshot => {
        const room = snapshot.val();
        if (!room) return;

        updateLobby(room);

        // 🔧 FIX: DO NOT block word screen refresh by screen ID
        if (room.status === 'words' && room.gameData?.playerWords) {
            showWordScreen(room); // always refresh
            return;
        }

        if (room.status === 'gm-selecting') {
            showGMSelectionScreen(room);
        } else if (room.status === 'discussion') {
            showDiscussionScreen(room);
        } else if (room.status === 'voting') {
            showVotingScreen(room);
        } else if (room.status === 'wolf-guess') {
            showWolfGuessScreen(room);
        } else if (room.status === 'final-results') {
            showFinalResultsScreen(room);
        } else if (room.status === 'lobby') {
            showScreen('lobbyScreen');
        }
    });
}

// ================= WORD SCREEN =================
function showWordScreen(room) {
    // GM view
    if (room.players[currentPlayer.id]?.isGameMaster) {
        showGameMasterScreen(room);
        return;
    }

    const myData = room.gameData.playerWords[currentPlayer.id];
    if (!myData) return;

    const card = document.getElementById('myWordCard');
    card.textContent = myData.word;
    card.className = 'word-card';

    document.querySelector('#wordScreen h2').textContent = 'あなたのお題';

    const readyBtn = document.getElementById('readyBtn');
    readyBtn.style.display = 'block';
    readyBtn.disabled = myData.ready;
    readyBtn.textContent = myData.ready ? '準備完了！' : '準備完了';

    document.getElementById('totalPlayers').textContent = Object.keys(room.gameData.playerWords).length;
    updateReadyCount(room);

    showScreen('wordScreen');
}

// ================= GM WAITING SCREEN =================
function showGMSelectionScreen(room) {
    if (currentPlayer.id === room.gameData.gameMasterId) {
        showScreen('wolfWordSelectionScreen');
    } else {
        showScreen('wordScreen');
        document.getElementById('myWordCard').textContent = '待機中...';
        document.querySelector('#wordScreen h2').textContent = 'GMがお題を選んでいます';
        document.getElementById('readyBtn').style.display = 'none';
    }
}

// ================= REMAINDER =================
// Everything else (timer, voting, results, etc.) remains unchanged
</script>

</body>
</html>
